apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: p3-ingress-app
  namespace: dev
spec:
  rules:
    - host: app.p3.iot
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-service
                port:
                  number: 8888
