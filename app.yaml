apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-deployment
  namespace: dev
  labels:
    app: wil42playground
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wil42playground
  template:
    metadata:
      labels:
        app: wil42playground
    spec:
      containers:
        - name: wil42playground
          image: wil42/playground:v2
          ports:
            - containerPort: 8888

---
apiVersion: v1
kind: Service
metadata:
  name: app-service
  namespace: dev
spec:
  selector:
    app: wil42playground
  ports:
    - port: 8888
      targetPort: 8888
